AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Civic Pulse API - AI Agent Traffic Gateway
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs24.x
Resources:
  GatewayFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda.handler
      CodeUri: GatewayFunction
      Environment:
        Variables:
          RATE_LIMIT_TABLE_NAME:
            Ref: RateLimitTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: RateLimitTable
      Events:
        AnyRequest:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId:
              Ref: GatewayApi
    Metadata:
      SamResourceId: GatewayFunction
  GatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        DefaultAuthorizer: MachineTokenAuthorizer
        Authorizers:
          MachineTokenAuthorizer:
            FunctionArn:
              Fn::GetAtt:
              - TokenAuthorizerFunction
              - Arn
            Identity:
              Header: Authorization
  TokenAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: authorizer.handler
      CodeUri: TokenAuthorizerFunction
      Environment:
        Variables:
          USER_POOL_ID:
            Ref: GatewayUserPool
          MACHINE_CLIENT_ID:
            Ref: MachineAppClient
          HUMAN_CLIENT_ID:
            Ref: HumanAppClient
    Metadata:
      SamResourceId: TokenAuthorizerFunction
  RateLimitTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-RateLimitTable
      PrimaryKey:
        Name: clientId
        Type: String
  GatewayUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName:
        Fn::Sub: ${AWS::StackName}-UserPool
      AutoVerifiedAttributes:
      - email
      UsernameAttributes:
      - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
  GatewayUserpoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain:
        Fn::Sub: ${AWS::StackName}-auth
      UserPoolId:
        Ref: GatewayUserPool
  GatewayResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
      UserPoolId:
        Ref: GatewayUserPool
      Identifier: gateway
      Name: GatewayAPI
      Scopes:
      - ScopeName: invoke
        ScopeDescription: Permission to call the gateway API
  HumanAppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName:
        Fn::Sub: ${AWS::StackName}-HumanAppClient
      UserPoolId:
        Ref: GatewayUserPool
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false
      AllowedOAuthFlows:
      - code
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
      - openid
      - email
      CallbackURLs:
      - https://example.com/callback
      SupportedIdentityProviders:
      - COGNITO
  MachineAppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName:
        Fn::Sub: ${AWS::StackName}-machine-client
      UserPoolId:
        Ref: GatewayUserPool
      GenerateSecret: true
      AllowedOAuthFlows:
      - client_credentials
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes:
      - gateway/invoke
      SupportedIdentityProviders:
      - COGNITO
    DependsOn: GatewayResourceServer
Outputs:
  ApiUrl:
    Description: Base URL for the deployed API
    Value:
      Fn::Sub: https://${GatewayApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/
  UserPoolDomain:
    Value:
      Fn::Sub: https://${AWS::StackName}-auth.auth.${AWS::Region}.amazoncognito.com
  UserPoolId:
    Value:
      Ref: GatewayUserPool
  MachineAppClientId:
    Value:
      Ref: MachineAppClient
