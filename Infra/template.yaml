AWSTemplateFormatVersion: '2010-09-09'
#This Tells the AWS CloudFormation that this file is a SAM Template,
# which let us write Serverless Functions.
Transform: AWS::Serverless-2016-10-31
Description: Civic Pulse API - AI Agent Traffic Gateway

# Matches your local Node Version
Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: nodejs24.x


Resources:
  GatewayFunction:
    Type: AWS::Serverless::Function
    Properties:
      #Run the Lambda function from the dist folder, which is created by the build script.
      Handler: lambda.handler
      CodeUri: ../dist/
      Environment:
        Variables:
        # Set the name of the rate limit table as an environment variable.
          RATE_LIMIT_TABLE_NAME: !Ref RateLimitTable
      Policies:
      # Grant the Lambda function permissions to read and write to the DynamoDB table.
        - DynamoDBCrudPolicy:
            TableName: !Ref RateLimitTable
      Events:
      # Define an API Gateway event that triggers the Lambda function for any HTTP request.
        AnyRequest:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref GatewayApi

# Define the API Gateway with a custom Lambda authorizer so requests must carry a valid access token.
  GatewayApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Auth:
        DefaultAuthorizer: MachineTokenAuthorizer
        Authorizers:
          MachineTokenAuthorizer:
            FunctionArn: !GetAtt TokenAuthorizerFunction.Arn
            Identity:
              Header: Authorization

  TokenAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: authorizer.handler
      CodeUri: ../dist/
      Environment:
        Variables:
          USER_POOL_ID: !Ref GatewayUserPool
          MACHINE_CLIENT_ID: !Ref MachineAppClient

# Define a DynamoDB table to store rate limit data.
  RateLimitTable:
    Type: AWS::Serverless::SimpleTable
    Properties:
      TableName: !Sub ${AWS::StackName}-RateLimitTable
      PrimaryKey:
        Name: clientId
        Type: String

  GatewayUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-UserPool
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          
  GatewayUserpoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Sub ${AWS::StackName}-auth
      UserPoolId: !Ref GatewayUserPool
  
  GatewayResourceServer:
    Type: AWS::Cognito::UserPoolResourceServer
    Properties:
       UserPoolId: !Ref GatewayUserPool
       Identifier: gateway
       Name: GatewayAPI
       Scopes:
          - ScopeName: invoke
            ScopeDescription: Permission to call the gateway API

  HumanAppClient:
     Type: AWS::Cognito::UserPoolClient
     Properties:
        ClientName: !Sub ${AWS::StackName}-HumanAppClient
        UserPoolId: !Ref GatewayUserPool
        ExplicitAuthFlows:
          - ALLOW_USER_PASSWORD_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        GenerateSecret: false
        AllowedOAuthFlows:
          - code
        AllowedOAuthFlowsUserPoolClient: true
        AllowedOAuthScopes:
          - openid
          - email
        CallbackURLs:
           - https://example.com/callback
        SupportedIdentityProviders:
          - COGNITO     


  MachineAppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
        ClientName: !Sub ${AWS::StackName}-machine-client
        UserPoolId: !Ref GatewayUserPool
        GenerateSecret: true
        AllowedOAuthFlows:
          - client_credentials
        AllowedOAuthFlowsUserPoolClient: true
        AllowedOAuthScopes:
          - gateway/invoke



          
        SupportedIdentityProviders:
          - COGNITO  
    DependsOn: GatewayResourceServer    


# Prints the HTTPS URL For Testing 
Outputs:
  ApiUrl:
    Description: Base URL for the deployed API
    Value: !Sub "https://${GatewayApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"
  
  UserPoolDomain:
    Value: !Sub "https://${AWS::StackName}-auth.auth.${AWS::Region}.amazoncognito.com"

  UserPoolId:
    Value: !Ref GatewayUserPool

  MachineAppClientId:
    Value: !Ref MachineAppClient